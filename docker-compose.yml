version: '3.8'

services:
  react:
    build:
      context: ./react
    volumes:
      # ソースコードをマウント
      - ./react/project:/var/www/vite-project
      # 変更点：node_modules をホストから分離し、コンテナ専用ボリュームを使用
      - react_node_modules:/var/www/vite-project/node_modules
      - ./locales:/var/www/locales
    environment:
      TZ: ${TZ}
      VITE_APP_API_URL: http://localhost:8080
      NODE_ENV: ${ENV_MODE}
      APP_LANG: ${APP_LANG}
      APP_URL: ${APP_URL}
    ports:
      - "3000:3000"
      - "5173:5173"
    expose:
      - "3000"
    tty: true
    stdin_open: true
    networks:
      go_app_net:
        ipv4_address: 192.168.111.101

  go:
    build:
      context: ./go
    volumes:
      - ./go:/usr/src/app
      - ./locales:/usr/src/locales
    environment:
      TZ: ${TZ}
      EMAIL_FROM: "noreply@example.com"
      EMAIL_PASSWORD: ""
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      APP_URL: ${APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET : ${JWT_REFRESH_SECRET}
      NODE_ENV: ${ENV_MODE}
      APP_LANG: ${APP_LANG}
    ports:
      - "8080:8080"
    expose:
      - "8080"
    tty: true
    stdin_open: true
    depends_on:
      - mysql
      - mailpit
    networks:
      go_app_net:
        ipv4_address: 192.168.111.102

  nginx:
    build:
      context: ./nginx
    volumes:
      - ./nginx/:/etc/nginx/
      - ./react/project/dist:/usr/share/nginx/html
    environment:
      TZ: ${TZ}
      NODE_ENV: ${ENV_MODE}
    ports:
      - "8000:8000"
    expose:
      - "8000"
    tty: true
    stdin_open: true
    depends_on:
      - react
      - go
    networks:
      go_app_net:
        ipv4_address: 192.168.111.103

  mysql:
    build:
      context: ./mysql
    volumes:
      - ./redis/data:/data
      - ./mysql/data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
      NODE_ENV: ${ENV_MODE}
    ports:
      - "3306:3306"
    expose:
      - "3306"
    tty: true
    stdin_open: true
    networks:
      go_app_net:
        ipv4_address: 192.168.111.104

  redis:
    build:
      context: ./redis
    environment:
      TZ: ${TZ}
      NODE_ENV: ${ENV_MODE}
    ports:
      - "6379:6379"
    expose:
      - "6379"
    tty: true
    stdin_open: true
    networks:
      go_app_net:
        ipv4_address: 192.168.111.105

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    networks:
      go_app_net:
        ipv4_address: 192.168.111.106

networks:
  go_app_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.111.0/24

# 変更点：react_node_modules のための定義を追加
volumes:
  react_node_modules: